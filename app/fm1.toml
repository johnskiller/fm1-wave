# fm1-wave: build settings (tools/build.py)
name = "wave"              # APP_NAME is in app.h; this names the build's files
id_prefix = "FM-1_94"          # package identity (each firmware its own): dev FM-1_1100, releases FM-1_11XXYYZZ
usb_manufacturer = "fm1-base"
usb_product = "FM1-WAVE"
o2 = []                        # separate units compiled at -O2 (an app's DSP)
words = "words.tsv"
ble = true                     # Bluetooth MIDI (--no-ble builds without it)
ble_central = true             # and the FM-1 connects to Bluetooth MIDI devices too
# the site (tools/make_site.py, tools/publish_site.sh)
tagline = "a polyphonic wavetable synth for the M-VAVE FM-1"
repo = "https://github.com/johnskiller/fm1-wave"
licence = "MPL-2.0"
credits = "Built on fm1-base by Charles Vestal"                   # a sentence for the installer's footer: what your firmware is built from
